name: transcode-video

on:
  repository_dispatch:
    types: [transcode_video]

# A second dispatch for the same submodule cancels the in-flight job — only
# the latest upload matters.
concurrency:
  group: transcode-${{ github.event.client_payload.submodule_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUBMODULE_ID: ${{ github.event.client_payload.submodule_id }}
      SOURCE_KEY: ${{ github.event.client_payload.source_key }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}

    steps:
      - name: Validate payload
        run: |
          set -euo pipefail
          # submodule_id must be a positive integer
          case "$SUBMODULE_ID" in
            ''|*[!0-9]*) echo "invalid submodule_id"; exit 1 ;;
          esac
          # source_key must live under raw/<submodule_id>/
          case "$SOURCE_KEY" in
            raw/$SUBMODULE_ID/*) ;;
            *) echo "source_key outside raw/$SUBMODULE_ID/"; exit 1 ;;
          esac
          # callback_url must be https://
          case "$CALLBACK_URL" in
            https://*) ;;
            *) echo "callback_url must be https"; exit 1 ;;
          esac

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ secrets.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/' }}
          export-type: env
          # The action masks fetched values in logs by default.

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache AWS CLI v2
        id: cache-awscli
        uses: actions/cache@v4
        with:
          path: |
            /opt/aws-cli
            /opt/aws-bin
          key: awscli-v2-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Install AWS CLI v2
        run: |
          set -euo pipefail
          if [ ! -x /opt/aws-bin/aws ]; then
            tmp=$(mktemp -d)
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$tmp/awscliv2.zip"
            unzip -q "$tmp/awscliv2.zip" -d "$tmp"
            sudo mkdir -p /opt/aws-cli /opt/aws-bin
            sudo "$tmp/aws/install" --install-dir /opt/aws-cli --bin-dir /opt/aws-bin
            rm -rf "$tmp"
          else
            "/opt/aws-bin/aws" --version >/dev/null
          fi
          echo "/opt/aws-bin" >> "$GITHUB_PATH"

      - name: Configure AWS CLI for R2
        run: |
          set -euo pipefail
          : "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID missing — Infisical fetch failed}"
          : "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY missing — Infisical fetch failed}"
          # Map R2_* -> AWS_* for aws CLI. Mask explicitly (Infisical already masks, belt+braces).
          echo "::add-mask::$R2_ACCESS_KEY_ID"
          echo "::add-mask::$R2_SECRET_ACCESS_KEY"
          {
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "AWS_DEFAULT_REGION=auto"
            echo "AWS_REGION=auto"
          } >> "$GITHUB_ENV"

      - name: Download raw video from R2
        run: |
          set -euo pipefail
          mkdir -p work
          aws s3 cp "s3://${R2_BUCKET}/${SOURCE_KEY}" work/input \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

      - name: Probe duration
        id: probe
        run: |
          set -euo pipefail
          dur=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 work/input | awk '{printf "%d\n", $1}')
          echo "duration_sec=$dur" >> $GITHUB_OUTPUT

      - name: Transcode to HLS ladder
        run: |
          set -euo pipefail

          # Source may have no audio track. Substitute a silent stereo track so
          # the HLS ladder still has an audio group.
          HAS_AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=index \
            -of csv=p=0 work/input | head -n1)
          if [ -n "$HAS_AUDIO" ]; then
            AUDIO_INPUT_ARGS=()
            AUDIO_MAP="0:a:0"
            SHORTEST_ARGS=()
          else
            AUDIO_INPUT_ARGS=(-f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000")
            AUDIO_MAP="1:a:0"
            SHORTEST_ARGS=(-shortest)
          fi

          # Source height/fps decide which rungs are worth encoding and the
          # GOP size (keyframe interval tied to actual fps, not a guess).
          SRC_H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height \
            -of csv=p=0 work/input)
          SRC_FPS_RAW=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate \
            -of csv=p=0 work/input)
          FPS=$(awk -F'/' '{ if ($2==0){print 30} else {r=$1/$2; if (r<1) r=30; printf "%d", r+0.5} }' <<< "$SRC_FPS_RAW")
          GOP=$(( FPS * 6 ))

          RUNG_W=(640 1280 1920)
          RUNG_H=(360 720 1080)
          RUNG_CRF=(23 21 20)
          RUNG_MAXRATE=(856k 2996k 5350k)
          RUNG_BUFSIZE=(1200k 4200k 7500k)
          RUNG_PROFILE=(main main high)

          # Always keep the 360p floor. Only add a higher rung if the source
          # actually has the resolution to fill it — skips encoding/storing a
          # near-duplicate of a lower rung for low-res uploads.
          INCLUDE=(0)
          for i in 1 2; do
            if [ "$SRC_H" -ge "${RUNG_H[$i]}" ]; then
              INCLUDE+=("$i")
            fi
          done
          N=${#INCLUDE[@]}

          mkdir -p out
          for j in $(seq 0 "$N"); do mkdir -p "out/v$j"; done

          SPLIT_LABELS=""
          for j in $(seq 1 "$N"); do SPLIT_LABELS+="[s$j]"; done
          FILTER="[0:v]split=$N${SPLIT_LABELS};"
          VIDEO_ARGS=()
          j=0
          for i in "${INCLUDE[@]}"; do
            j=$((j + 1))
            vidx=$((j - 1))
            FILTER+=" [s$j]scale=w=${RUNG_W[$i]}:h=${RUNG_H[$i]}:force_original_aspect_ratio=decrease:force_divisible_by=2[v${j}out];"
            VIDEO_ARGS+=(-map "[v${j}out]" -c:v:$vidx libx264 -preset veryfast -profile:v "${RUNG_PROFILE[$i]}" \
              -crf:v:$vidx "${RUNG_CRF[$i]}" -maxrate:v:$vidx "${RUNG_MAXRATE[$i]}" -bufsize:v:$vidx "${RUNG_BUFSIZE[$i]}" \
              -g "$GOP" -keyint_min "$GOP" -sc_threshold 0)
          done
          FILTER="${FILTER%;}"

          # One shared audio encode (HLS audio group) instead of one re-encode
          # per video rung — same audio quality, a third of the audio work.
          VAR_STREAM_MAP="a:0,agroup:aud,default:yes,name:audio"
          for j in $(seq 1 "$N"); do
            vidx=$((j - 1))
            VAR_STREAM_MAP+=" v:$vidx,agroup:aud"
          done

          ffmpeg -y -hide_banner -i work/input "${AUDIO_INPUT_ARGS[@]}" \
            -filter_complex "$FILTER" \
            "${VIDEO_ARGS[@]}" \
            -map "$AUDIO_MAP" -c:a:0 aac -b:a:0 128k -ac 2 \
            "${SHORTEST_ARGS[@]}" \
            -f hls -hls_time 6 -hls_playlist_type vod -hls_flags independent_segments \
            -hls_segment_filename "out/v%v/seg_%03d.ts" \
            -master_pl_name master.m3u8 \
            -var_stream_map "$VAR_STREAM_MAP" \
            "out/v%v/playlist.m3u8"

      - name: Upload HLS output to R2
        run: |
          set -euo pipefail
          DEST="hls/${SUBMODULE_ID}"
          aws s3 sync out/ "s3://${R2_BUCKET}/${DEST}/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress \
            --content-type "video/mp2t" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "*.ts"
          aws s3 sync out/ "s3://${R2_BUCKET}/${DEST}/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress \
            --content-type "application/vnd.apple.mpegurl" \
            --cache-control "public, max-age=60" \
            --exclude "*" --include "*.m3u8"
          echo "MASTER_URL=${R2_PUBLIC_BASE}/${DEST}/master.m3u8" >> $GITHUB_ENV

      - name: Notify backend (success)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY=$(jq -cn \
                  --argjson id "$SUBMODULE_ID" \
                  --arg url "$MASTER_URL" \
                  --argjson dur ${{ steps.probe.outputs.duration_sec }} \
                  --arg run_id "$RUN_ID" \
                  --arg run_url "$RUN_URL" \
                  '{submodule_id:$id, status:"completed", master_url:$url, duration_sec:$dur, run_id:$run_id, run_url:$run_url}')
          TS=$(date +%s)
          NONCE=$(openssl rand -hex 16)
          BODY_HASH=$(printf '%s' "$BODY" | openssl dgst -sha256 -hex | awk '{print $2}')
          SIGNING_INPUT=$(printf '%s\n%s\n%s' "$TS" "$NONCE" "$BODY_HASH")
          SIG=$(printf '%s' "$SIGNING_INPUT" \
            | openssl dgst -sha256 -mac HMAC -macopt "key:${TRANSCODE_WEBHOOK_SECRET}" -hex \
            | awk '{print $2}')
          curl --fail-with-body -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Transcode-Timestamp: $TS" \
            -H "X-Transcode-Nonce: $NONCE" \
            -H "X-Transcode-Signature: sha256=$SIG" \
            --data "$BODY"

      - name: Notify backend (failure)
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # Best-effort failure callback. If Infisical failed before this step,
          # TRANSCODE_WEBHOOK_SECRET is empty — backend will reject the signature
          # and the row stays at "uploaded" for the watchdog to retry. That's fine.
          if [ -z "${TRANSCODE_WEBHOOK_SECRET:-}" ]; then
            echo "no webhook secret available; skipping failure callback"
            exit 0
          fi
          BODY=$(jq -cn \
                  --argjson id "$SUBMODULE_ID" \
                  --arg err "transcode workflow failed: see $RUN_URL" \
                  --arg run_id "$RUN_ID" \
                  --arg run_url "$RUN_URL" \
                  '{submodule_id:$id, status:"failed", error:$err, run_id:$run_id, run_url:$run_url}')
          TS=$(date +%s)
          NONCE=$(openssl rand -hex 16)
          BODY_HASH=$(printf '%s' "$BODY" | openssl dgst -sha256 -hex | awk '{print $2}')
          SIGNING_INPUT=$(printf '%s\n%s\n%s' "$TS" "$NONCE" "$BODY_HASH")
          SIG=$(printf '%s' "$SIGNING_INPUT" \
            | openssl dgst -sha256 -mac HMAC -macopt "key:${TRANSCODE_WEBHOOK_SECRET}" -hex \
            | awk '{print $2}')
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Transcode-Timestamp: $TS" \
            -H "X-Transcode-Nonce: $NONCE" \
            -H "X-Transcode-Signature: sha256=$SIG" \
            --data "$BODY" || true
